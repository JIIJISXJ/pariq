<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pariq Store | إكسسوارات • هدايا • تجميل • عناية بالبشرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --lime: #c8ff00;
      --black: #0a0a0a;
      --dark: #111;
      --gray: #1a1a1a;
      --text: #f5f5f5;
      --muted: #999;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--black);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ========== TOP BAR ========== */
    .top-bar {
      background: var(--lime);
      color: #000;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      background: var(--lime);
      color: #000;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 36px;
      font-size: 15px;
      font-weight: 500;
    }

    nav a {
      position: relative;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--lime); }
    nav a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 0;
      width: 100%;
      height: 2px;
      background: var(--lime);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .lang-btn {
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn:hover { border-color: var(--lime); color: var(--lime); }

    .icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }

    .cart-count {
      position: absolute;
      top: 2px;
      left: 2px;
      background: var(--lime);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== HERO ========== */
    .hero {
      position: relative;
      height: 88vh;
      min-height: 620px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1210 0%, #0d0d0d 50%, #1a1018 100%);
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
      filter: brightness(0.7) contrast(1.1);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 48px;
      width: 100%;
    }

    .hero-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--lime);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      max-width: 680px;
    }

    .hero p {
      font-size: 18px;
      color: rgba(255,255,255,0.75);
      max-width: 480px;
      margin-bottom: 36px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1.5px solid var(--white);
      color: var(--white);
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 4px;
      transition: all 0.25s;
    }
    .btn-primary:hover {
      background: var(--white);
      color: #000;
    }

    .hero-tags {
      position: absolute;
      bottom: 40px;
      left: 48px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      border-right: 2px solid var(--lime);
      padding-right: 16px;
    }

    /* ========== COMING SOON ========== */
    .coming-soon {
      padding: 80px 32px;
      text-align: center;
      background: var(--dark);
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .coming-soon .label {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--lime);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .coming-soon h2 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .coming-soon .time-text {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 15px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .countdown-item {
      background: var(--gray);
      padding: 20px 28px;
      border-radius: 12px;
      min-width: 100px;
    }

    .countdown-item .num {
      font-size: 36px;
      font-weight: 800;
      display: block;
    }

    .countdown-item .unit {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ========== PRODUCTS ========== */
    .products {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 32px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .section-header .label {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--lime);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .section-header h2 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .section-header p {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
      color: var(--muted);
    }
    .filter-btn.active,
    .filter-btn:hover {
      background: var(--lime);
      color: #000;
      border-color: var(--lime);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .product-card {
      background: var(--gray);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .product-img {
      position: relative;
      aspect-ratio: 1/1.1;
      overflow: hidden;
      background: #222;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }
    .product-card:hover .product-img img {
      transform: scale(1.06);
    }

    .product-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--lime);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .product-info {
      padding: 20px;
    }

    .product-cat {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-price {
      font-size: 18px;
      font-weight: 700;
    }

    .add-btn {
      background: rgba(255,255,255,0.08);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 20px;
    }
    .add-btn:hover {
      background: var(--lime);
      color: #000;
    }

    /* ========== WHY ========== */
    .why {
      background: var(--dark);
      padding: 90px 32px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .why-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .why-header {
      text-align: center;
      margin-bottom: 60px;
    }

    .why-header h2 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .why-header h2 span {
      color: var(--lime);
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    .why-item {
      text-align: center;
    }

      font-weight: 700;
